name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mocklab
          POSTGRES_PASSWORD: mocklab_secret_password
          POSTGRES_DB: mocklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://mocklab:mocklab_secret_password@localhost:5432/mocklab?schema=public"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm test

      - name: Build Monorepo (Next.js & NestJS)
        env:
          DATABASE_URL: "postgresql://mocklab:mocklab_secret_password@localhost:5432/mocklab?schema=public"
        run: pnpm build
