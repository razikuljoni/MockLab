name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mocklab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || github.run_id }}
          POSTGRES_DB: mocklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mocklab/api exec prisma generate

      - name: Build Shared Package
        run: pnpm --filter @mocklab/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm test

      - name: Run E2E Tests (Flows F1-F5)
        run: pnpm test:e2e

      - name: Build Monorepo (Next.js & NestJS)
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
        run: pnpm build

      - name: Check for Changeset
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)" ]; then
            echo "::warning::No changeset found in this pull request. Consider adding one with 'pnpm changeset' or 'pnpm changeset:auto'."
          else
            echo "Changeset detected for release."
          fi
