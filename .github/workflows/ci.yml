name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mocklab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || github.run_id }}
          POSTGRES_DB: mocklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mocklab/api exec prisma generate

      - name: Build Shared Package
        run: pnpm --filter @mocklab/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm test

      - name: Build Monorepo (Next.js & NestJS)
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
        run: pnpm build

      - name: Migrate Database
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
        run: pnpm --filter @mocklab/api exec prisma migrate deploy

      - name: Run E2E Tests (Flows F1-F5)
        env:
          DATABASE_URL: "postgresql://mocklab:${{ secrets.POSTGRES_PASSWORD || github.run_id }}@localhost:5432/mocklab?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "mocklab-test-jwt-secret-minimum-64-characters-for-ci-testing-environment"
          SECRET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          PLAYWRIGHT_API_BASE_URL: "http://localhost:3001"
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
        run: |
          # Start background services for self-contained CI testing
          node apps/api/dist/main.js &
          API_PID=$!
          pnpm --filter @mocklab/web start -p 3000 &
          WEB_PID=$!

          # Wait for API and Web servers to be healthy
          for i in {1..30}; do
            if curl -s http://localhost:3001/health > /dev/null && curl -s http://localhost:3000 > /dev/null; then
              echo "Services ready!"
              break
            fi
            echo "Waiting for services..."
            sleep 1
          done

          # Execute Playwright E2E suite
          pnpm test:e2e

          # Cleanup processes
          kill $API_PID $WEB_PID || true

      - name: Check for Changeset
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)" ]; then
            echo "::warning::No changeset found in this pull request. Consider adding one with 'pnpm changeset' or 'pnpm changeset:auto'."
          else
            echo "Changeset detected for release."
          fi
